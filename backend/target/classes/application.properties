spring.application.name=college-erp-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_erp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:NewPassword@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Change these environment-backed defaults before deployment.
college.admin.email=${ADMIN_EMAIL:admin@college.edu}
college.admin.password=${ADMIN_PASSWORD:password}
college.member.password=${MEMBER_PASSWORD:password}
college.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment-1234567890}
